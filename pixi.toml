[workspace]
name = "smi-tiled-browser"
description = "Interactive browser for SMI beamline data on the NSLS-II Tiled catalog"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = "3.11.*"
numpy = ">=1.26,<3"
xarray = ">=2025.6,<2027"
pandas = ">=2.0,<3"
# Use the *-base variants: this is a headless Bokeh/Panel web app rendering
# Matplotlib via the Agg backend, so the GUI meta-packages (matplotlib,
# pyfai) only drag in the Qt5/Qt6 stacks (qt-main, qt6-main, pyqt, pyside6,
# qtconsole, …) — ~130 MiB of unused dependencies. The -base packages carry
# the full compute/plotting core without any Qt.
matplotlib-base = ">=3.9,<4"
bokeh = ">=3.9,<4"
panel = ">=1.8,<2"
scipy = ">=1.11"
pyfai-base = ">=2024.9"
tiled = "*"
bluesky-tiled-plugins = "*"
httpx = "*"
pytest = "*"

[pypi-dependencies]
# Local editable install of smi-tiled (the SMI-focused successor to the
# PyHyperScattering SMI branch).  Eventually distributed together with
# smi-browser; until then keep it editable so changes flow through.
# To switch to a released version:  smi-tiled = ">=0.1"
# To pin to a GitHub fork:
#   smi-tiled = { git = "https://github.com/EliotGann/smi-tiled.git", branch = "main", extras = ["tiled"] }
smi-tiled = { path = "../smi-tiled", editable = true, extras = ["tiled"] }

# PYTHONNOUSERSITE=1 keeps the pixi env from being shadowed by stale
# packages in ~/.local/lib/python3.11/site-packages (e.g. an old pydantic
# that's ABI-incompatible with the pixi-installed pydantic_core).
[tasks.serve]
cmd = "panel serve smi_app.py --show --autoreload"
env = { PYTHONNOUSERSITE = "1" }

[tasks.check]
cmd = "python -c \"import tiled_browser; import smi_browser; print('OK')\""
env = { PYTHONNOUSERSITE = "1" }

[tasks.test]
cmd = "python -m pytest tests/ -q"
env = { PYTHONNOUSERSITE = "1" }
